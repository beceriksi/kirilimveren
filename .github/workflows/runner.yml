name: Crypto Breakout Scanner

on:
  schedule:
    # Her saat başı çalışır (Cron: dak sa gün ay haftanın_günü)
    - cron: '0 * * * *'
  workflow_dispatch: # GitHub web arayüzünden istediğiniz zaman elle çalıştırmak için

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Kırılım ve Hacim Taramasını Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
